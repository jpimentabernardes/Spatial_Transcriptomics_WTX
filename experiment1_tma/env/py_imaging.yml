# Python side of experiment1_tma: 07_register_he.py and the tma_toolkit package.
#   conda env create -f env/py_imaging.yml && conda activate exp1-imaging
#   pip install -e ../tma_toolkit            # optional: the AnnData toolkit
# Notebooks: register the environment as a Jupyter kernel once, then pick
# "exp1-imaging" as the kernel (Kernel > Change kernel):
#   python -m ipykernel install --user --name exp1-imaging --display-name exp1-imaging
name: exp1-imaging
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas>=2,<3      # tma_toolkit is written for pandas 2
  - scipy
  - pyarrow
  - matplotlib
  - anndata
  - scikit-learn
  - h5py
  - ipykernel        # so Jupyter can run the notebooks in this environment
  - pip
